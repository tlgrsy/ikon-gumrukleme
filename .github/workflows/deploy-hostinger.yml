name: Deploy to Hostinger (manual FTP)

# Aktif otomatik yayın: Hostinger hPanel → Git entegrasyonu (push ile otomatik çekim).
# Bu iş akışı yalnızca isteğe bağlı/manual FTP yedeği içindir.
on:
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP ayarları var mı?
        if: env.FTP_SERVER == ''
        run: echo "::notice::FTP_SERVER secret'ı tanımlı değil — deploy atlandı. DEPLOY.md → GitHub Secrets."

      - name: Deploy site via FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/preview/**
            **/tools/**
            **/README.md
            **/DEPLOY.md
            **/deploy.sh
            **/.DS_Store
            **/.gitignore
